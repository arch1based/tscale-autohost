name: Build & Release

# Τρέχει όταν ανεβαίνει tag τύπου v1.2.3 — χτίζει το exe σε Windows runner
# και το ανεβάζει ως asset του Release. Δεν χρειάζεται μηχάνημα Windows.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Εγκατάσταση εξαρτήσεων
        run: python -m pip install --upgrade pip pyinstaller pystray Pillow

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ICSautoScaleUpdater
          --icon logo.ico
          --add-data "config_default.json;."
          --add-data "logo.png;."
          --add-data "logo.ico;."
          autohost.py

      - name: Έλεγχος ότι βγήκε το exe
        shell: pwsh
        run: |
          $exe = "dist\ICSautoScaleUpdater.exe"
          if (-not (Test-Path $exe)) { throw "Δεν βρέθηκε το $exe" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "OK: $exe ($mb MB)"
          if ($mb -lt 5) { throw "Το exe είναι ύποπτα μικρό ($mb MB)" }

      - name: Σημειώσεις έκδοσης από το VERSION
        shell: pwsh
        run: |
          $lines = Get-Content VERSION
          ($lines | Select-Object -Skip 1) -join "`n" | Set-Content notes.txt -Encoding utf8
          if ((Get-Content notes.txt -Raw).Trim() -eq "") { "Νέα έκδοση" | Set-Content notes.txt -Encoding utf8 }

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ICSautoScaleUpdater.exe
          body_path: notes.txt
          name: Έκδοση ${{ github.ref_name }}
