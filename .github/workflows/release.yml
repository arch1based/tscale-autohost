name: Build & Release

# Τρέχει όταν ανεβαίνει tag τύπου v1.2.3 — χτίζει το exe σε Windows runner
# και το ανεβάζει ως asset του Release. Δεν χρειάζεται μηχάνημα Windows.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Εγκατάσταση εξαρτήσεων
        # PyInstaller καρφωμένο κάτω από 6.22: από εκεί και πάνω ο bootloader κάνει
        # έλεγχο γονικής διεργασίας στο onefile και σκάει με «Security validation
        # failure: failed to obtain executable path for parent process» σε μηχανήματα
        # όπου το antivirus δεν επιτρέπει άνοιγμα του handle της γονικής διεργασίας.
        run: python -m pip install --upgrade pip "pyinstaller==6.21.0" pystray Pillow

      - name: Έκδοση PyInstaller
        run: pyinstaller --version

      # onedir και όχι onefile: το onefile ξεπακετάρει σε %TEMP% και ξαναξεκινά
      # τον εαυτό του, που τα antivirus μπλοκάρουν («Failed to load Python DLL»,
      # «Security validation failure»). Το onedir τρέχει κατευθείαν από τον φάκελο.
      - name: Build
        run: >
          pyinstaller --noconfirm --onedir --windowed --name ICSautoScaleUpdater
          --icon logo.ico
          --add-data "config_default.json;."
          --add-data "logo.png;."
          --add-data "logo.ico;."
          autohost.py

      - name: Έλεγχος και συμπίεση
        shell: pwsh
        run: |
          $exe = "dist\ICSautoScaleUpdater\ICSautoScaleUpdater.exe"
          if (-not (Test-Path $exe)) { throw "Δεν βρέθηκε το $exe" }
          Compress-Archive -Path "dist\ICSautoScaleUpdater\*" -DestinationPath "ICSautoScaleUpdater.zip" -Force
          $mb = [math]::Round((Get-Item "ICSautoScaleUpdater.zip").Length / 1MB, 1)
          Write-Host "OK: ICSautoScaleUpdater.zip ($mb MB)"
          if ($mb -lt 5) { throw "Το zip είναι ύποπτα μικρό ($mb MB)" }

      - name: Σημειώσεις έκδοσης από το VERSION
        shell: pwsh
        run: |
          $lines = Get-Content VERSION
          ($lines | Select-Object -Skip 1) -join "`n" | Set-Content notes.txt -Encoding utf8
          if ((Get-Content notes.txt -Raw).Trim() -eq "") { "Νέα έκδοση" | Set-Content notes.txt -Encoding utf8 }

      - uses: softprops/action-gh-release@v2
        with:
          files: ICSautoScaleUpdater.zip
          body_path: notes.txt
          name: Έκδοση ${{ github.ref_name }}
